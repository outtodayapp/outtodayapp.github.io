name: Event pages (share links)
# Co 3 godziny buduje strony udostępnianych wpisów (e/<rodzaj>-<id>.html) ze zdjęciem do podglądu w WhatsApp itd.
# Koszt 0 USD: GitHub Actions w publicznym repo, dane z publicznej bazy apki.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages-build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: bartoszmarcinkosek/outtoday-bots, path: bots }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow && python bots/bot/site_pages.py .
      - run: |
          rm -rf bots
          git config user.name "OutToday bot" && git config user.email "noreply@outtodayapp.github.io"
          git add -A e img index.html
          git diff --cached --quiet || (git commit -qm "Strony wpisów: aktualizacja" && git push -q)
