<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>OutToday · sprawdzanie wpisu</title>
<style>
  :root { --bg:#0D1B33; --card:#132544; --chip:#1B2D4F; --text:#EAF1FF; --muted:#9FB3D6; --line:#24385C;
          --ok:#2fbf71; --no:#e25555; --edit:#8FB4FF; --warn:#f0b54a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width:620px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:18px; margin:0 0 14px; color:var(--muted); font-weight:600; letter-spacing:.3px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .title { font-size:20px; font-weight:700; margin:0 0 6px; }
  .title a { color:var(--text); }
  .row { color:var(--muted); margin:2px 0; }
  .row b { color:var(--text); font-weight:600; }
  .gaps { color:var(--warn); font-weight:600; margin-top:8px; }
  .quote { background:var(--chip); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:14px; color:var(--muted); }
  .quote span { color:var(--text); }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; color:#fff; }
  button.big { width:100%; padding:16px; font-size:17px; }
  button.ok { background:var(--ok); } button.no { background:var(--no); } button.edit { background:#2f6fde; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=url] {
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--chip); color:var(--text); font:inherit; }
  input.missing { border-color:var(--warn); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--text); }
  .msg { padding:14px 16px; border-radius:12px; font-weight:600; margin-bottom:14px; }
  .msg.ok { background:#123d2a; color:#9ff0c4; } .msg.err { background:#4a1a1d; color:#ffd0d2; }
  a { color:var(--edit); }
  .small { font-size:13px; color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>OutToday · sprawdzanie</h1>
  <div id="msg"></div>
  <div id="app"><div class="card">Wczytuję…</div></div>
</main>
<script>
const FN = "https://ibpuispeimyyqiailjfy.supabase.co/functions/v1/review";
const PUBLISHABLE = "sb_publishable_2SPY_zl7rAw7K5D1T2TzwQ_mxpzYrCS";
const q = new URLSearchParams(location.search);
const TOKEN = q.get("t") || "";
const ACTION = q.get("a") || "";
const GAP = { start_time: "godzina", price: "cena", venue: "miejsce", date: "data" };
const FIELD = { price_text: "Cena", start_time: "Godzina", end_time: "Godzina końca", venue: "Miejsce", hours_text: "Godziny otwarcia",
  days_of_week: "Dni", official_url: "Oficjalna strona", phone: "Telefon" };
const KIND = { places: "Miejsce", deals: "Promocja" };

function simpleCard(r, table) {
  const link = r.official_url || r.url;
  const name = r.name || r.title;
  const days = Array.isArray(r.days_of_week) ? r.days_of_week.map((i) => ["Nd", "Pn", "Wt", "Śr", "Cz", "Pt", "Sb"][i]).join(", ") : "";
  const time = r.start_time ? r.start_time.slice(0, 5) + (r.end_time ? "–" + r.end_time.slice(0, 5) : "") : "";
  return `<div class="card">
    <div class="small">${esc(KIND[table] || "")}</div>
    <div class="title">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a>` : esc(name)}</div>
    <div class="row">${esc([r.venue, r.area, r.city].filter(Boolean).join(", "))}</div>
    ${r.hours_text ? `<div class="row">Godziny: <b>${esc(r.hours_text)}</b></div>` : ""}
    ${days || time ? `<div class="row">${esc(days)}${days && time ? " · " : ""}${esc(time)}</div>` : ""}
    ${r.price_text ? `<div class="row">Cena: <b>${esc(r.price_text)}</b></div>` : ""}
    ${r.details ? `<div class="small" style="margin-top:6px">${esc(r.details)}</div>` : ""}
    <div class="small" style="margin-top:8px">status: <b>${esc(r.status)}</b></div>
  </div>`;
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function call(action, extra = {}) {
  const r = await fetch(FN, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: PUBLISHABLE },
    body: JSON.stringify({ token: TOKEN, action, ...extra }),
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(data.error || `Błąd ${r.status}`);
  return data;
}

function say(text, ok = true) {
  $("#msg").innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${esc(text)}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
}

function eventCard(e) {
  const link = e.official_url || e.url;
  const when = fmtDate(e.start_date) + (e.end_date && e.end_date !== e.start_date ? " – " + fmtDate(e.end_date) : "");
  const time = e.start_time ? e.start_time.slice(0, 5) + (e.end_time ? "–" + e.end_time.slice(0, 5) : "") : "";
  const price = e.is_free ? "Free" : (e.price_text || "");
  const ev = e.evidence || {};
  const quotes = ["date", "time", "venue", "price"].filter((k) => ev[k])
    .map((k) => `<div class="quote">${{ date: "Data", time: "Godzina", venue: "Miejsce", price: "Cena" }[k]}: <span>„${esc(ev[k])}”</span></div>`).join("");
  const gaps = (e.gaps || []).map((g) => GAP[g] || g);
  return `<div class="card">
    <div class="title">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(e.title)} ↗</a>` : esc(e.title)}</div>
    <div class="row"><b>${esc(when)}</b>${time ? ` · <b>${esc(time)}</b>` : ""}</div>
    <div class="row">${esc([e.venue, e.city].filter(Boolean).join(", ")) || "<i>brak miejsca</i>"}</div>
    ${price ? `<div class="row">${esc(price)}</div>` : ""}
    ${gaps.length ? `<div class="gaps">Brakuje: ${esc(gaps.join(", "))}</div>` : ""}
    ${quotes ? `<div style="margin-top:10px" class="small">Cytaty ze strony źródłowej:</div>${quotes}` : ""}
    <div class="small" style="margin-top:8px">Źródło: ${esc(e.source_name || "")}${e.source_url ? ` · <a href="${esc(e.source_url)}" target="_blank" rel="noopener noreferrer">lista na stronie</a>` : ""} · status: <b>${esc(e.status)}</b></div>
  </div>`;
}

function editForm(e) {
  const v = (x) => esc(x ?? "");
  const miss = (g) => (e.gaps || []).includes(g) ? "missing" : "";
  return `<div class="card" id="form">
    <div class="title" style="font-size:17px">Uzupełnij</div>
    <label>Tytuł</label><input type="text" id="f_title" value="${v(e.title)}">
    <div class="two">
      <div><label>Data od</label><input type="date" id="f_start_date" value="${v(e.start_date)}"></div>
      <div><label>Data do (opcjonalnie)</label><input type="date" id="f_end_date" value="${v(e.end_date)}"></div>
    </div>
    <div class="two">
      <div><label>Godzina rozpoczęcia</label><input type="time" id="f_start_time" class="${miss("start_time")}" value="${v((e.start_time || "").slice(0, 5))}"></div>
      <div><label>Godzina końca</label><input type="time" id="f_end_time" value="${v((e.end_time || "").slice(0, 5))}"></div>
    </div>
    <label>Miejsce</label><input type="text" id="f_venue" class="${miss("venue")}" value="${v(e.venue)}">
    <div class="two">
      <div><label>Cena (tekst, np. From AED 95)</label><input type="text" id="f_price_text" class="${miss("price")}" value="${v(e.price_text)}"></div>
      <div><label>Najniższa cena AED</label><input type="number" id="f_price_min_aed" min="0" step="1" value="${v(e.price_min_aed)}"></div>
    </div>
    <div class="check"><input type="checkbox" id="f_is_free" ${e.is_free ? "checked" : ""}><span>Wstęp wolny</span></div>
    <label>Oficjalny link</label><input type="url" id="f_official_url" value="${v(e.official_url)}">
    <div class="btns" style="margin-top:16px">
      <button class="ok" id="saveApprove">Zapisz i zatwierdź</button>
      <button class="ghost" id="saveOnly">Tylko zapisz</button>
    </div>
  </div>`;
}

function readForm() {
  const f = {};
  for (const k of ["title", "start_date", "end_date", "start_time", "end_time", "venue", "price_text", "price_min_aed", "official_url"]) f[k] = $("#f_" + k).value;
  f.is_free = $("#f_is_free").checked;
  return f;
}

function busy(on) { document.querySelectorAll("button").forEach((b) => (b.disabled = on)); }

async function act(action, okText, extra) {
  busy(true);
  try {
    const res = await call(action, extra);
    say(res.already ? "To było już załatwione wcześniej." : okText, true);
    await load(true);
  } catch (err) {
    say(err.message, false);
    busy(false);
  }
}

async function load(after = false) {
  if (!TOKEN) { $("#app").innerHTML = `<div class="card">Brak linku. Otwórz przycisk z e-maila.</div>`; return; }
  let data;
  try { data = await call("get"); }
  catch (err) { $("#app").innerHTML = `<div class="card">${esc(err.message)}</div>`; return; }

  if (data.kind === "event") {
    const e = data.event;
    const done = e.status !== "pending";
    let main = "";
    if (!after && !done && ACTION === "approve") main = `<button class="ok big" id="go">✓ Potwierdź: zatwierdź i pokaż w apce</button>`;
    if (!after && e.status !== "rejected" && ACTION === "reject")
      main = `<button class="no big" id="go">✕ Potwierdź: ${e.status === "approved" ? "wycofaj z apki" : "odrzuć"}</button>`;
    $("#app").innerHTML = eventCard(e) + (main ? `<div class="card">${main}</div>` : "") +
      (ACTION === "edit" && !after ? editForm(e) : done ? `<div class="btns"><button class="edit" id="ed">✎ Popraw dane</button></div>` : `<div class="btns">
        ${ACTION !== "approve" ? `<button class="ok" id="ap">✓ Zatwierdź</button>` : ""}
        ${ACTION !== "reject" ? `<button class="no" id="rj">✕ Odrzuć</button>` : ""}
        <button class="edit" id="ed">✎ Uzupełnij</button></div>`);
    const go = $("#go");
    if (go) go.onclick = () => act(ACTION, ACTION === "approve" ? "Zatwierdzone. Wpis pojawi się w apce po odświeżeniu." : "Odrzucone. Wpis zniknie z apki po odświeżeniu.");
    if ($("#ap")) $("#ap").onclick = () => act("approve", "Zatwierdzone. Wpis pojawi się w apce po odświeżeniu.");
    if ($("#rj")) $("#rj").onclick = () => act("reject", "Odrzucone.");
    if ($("#ed")) $("#ed").onclick = () => { $("#ed").remove(); $("#app").insertAdjacentHTML("beforeend", editForm(e)); wireForm(); };
    wireForm();
    return;
  }

  if (data.kind === "change") {
    const c = data.change, e = data.event;
    const isUrl = c.field === "official_url";
    $("#app").innerHTML = (e ? (data.table && data.table !== "events" ? simpleCard(e, data.table) : eventCard(e)) : "") + `<div class="card">
      <div class="title" style="font-size:17px">${isUrl ? (c.new_value ? "Propozycja strony oficjalnej" : "Strona oficjalna przestała działać") : "Bot znalazł zmianę"}</div>
      <div class="row"><b>${esc(FIELD[c.field] || c.field)}:</b> ${esc(c.old_value || "–")} → <b>${esc(c.new_value || "(usuń link)")}</b></div>
      ${c.evidence ? `<div class="quote">${isUrl ? "Uzasadnienie" : "Cytat"}: <span>„${esc(c.evidence)}”</span></div>` : ""}
      ${c.source_url ? `<div class="small"><a href="${esc(c.source_url)}" target="_blank" rel="noopener noreferrer">${isUrl ? "Otwórz i sprawdź, czy to strona oficjalna ↗" : "Otwórz stronę źródłową ↗"}</a></div>` : ""}
      ${c.handled ? `<div class="msg ok" style="margin-top:12px">Już załatwione.</div>` : `<div class="btns" style="margin-top:12px">
        <button class="ok ${ACTION === "accept" ? "big" : ""}" id="acc">✓ ${ACTION === "accept" ? "Potwierdź: przyjmij zmianę" : "Przyjmij zmianę"}</button>
        <button class="ghost ${ACTION === "ignore" ? "big" : ""}" id="ign">${ACTION === "ignore" ? "Potwierdź: zostaw jak jest" : "Zostaw jak jest"}</button></div>`}
    </div>`;
    if ($("#acc")) $("#acc").onclick = () => act("accept", "Zmiana przyjęta. Apka pokaże nową wartość po odświeżeniu.");
    if ($("#ign")) $("#ign").onclick = () => act("ignore", "Zostawione bez zmian.");
  }
}

function wireForm() {
  if (!$("#saveApprove")) return;
  $("#saveApprove").onclick = () => act("save", "Zapisane i zatwierdzone.", { fields: readForm(), approve: true });
  $("#saveOnly").onclick = () => act("save", "Zapisane. Wpis dalej czeka na zatwierdzenie.", { fields: readForm(), approve: false });
}

load();
</script>
</body>
</html>
